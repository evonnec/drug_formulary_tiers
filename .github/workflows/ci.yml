name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job installs uv on the runner, which provisions the Python version in
# .python-version and the locked dependencies from uv.lock.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The local development settings, for docker compose and for later steps,
      # which get DATABASE_URL and TEST_DATABASE_URL from them.
      - name: Use the example settings
        run: |
          cp .env.example .env
          grep -v -e '^#' -e '^$' .env >> "$GITHUB_ENV"
      # Started first so db/01-init.sh loads the data while uv installs.
      - name: Start the formulary database
        run: docker compose up --detach
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-python: true
      - run: uv sync --locked
      - name: Wait for the database to finish loading
        run: docker compose up --detach --wait --wait-timeout 180
      - run: uv run pytest
      - name: Run Part 3 for its timings
        run: uv run formulary-tiers 3
      - name: Show database logs
        if: failure()
        run: docker compose logs postgres

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-python: true
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-python: true
      - run: uv sync --locked
      - run: uv run mypy

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-python: true
      - run: uv sync --locked
      - run: uv run ruff format --check --diff
