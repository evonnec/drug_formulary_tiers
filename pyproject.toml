# configuration for linters and project
[project]
name = "drug-formulary-tiers"
version = "0.1"
requires-python = ">=3.15"
# transitive dependencies are pinned in uv.lock
dependencies = [
    "pandas>=3.1",
    "psycopg[binary]>=3.3",
    "SQLAlchemy>=2.1",
]

[dependency-groups]
dev = [
    "ipython",
    "mypy>=2.4",
    "ruff>=0.17",
    "pandas-stubs",
    "pytest>=9.1",
    # floor kept from previous security bump
    "pygments>=2.20.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.15"
files = ["src", "connection.py", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
