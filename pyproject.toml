# configuration for linters and project
[project]
name = "drug-formulary-tiers"
version = "0.1"
description = "Average drug tier differences between Medicare formularies"
requires-python = ">=3.15"
# transitive dependencies are pinned in uv.lock
dependencies = [
    "pandas>=3.1",
    "psycopg[binary]>=3.3",
    "SQLAlchemy>=2.1",
]

[project.scripts]
formulary-tiers = "drug_formulary_tiers.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6",
    "ipython",
    "mypy>=2.4",
    "ruff>=0.17",
    "pandas-stubs",
    "pytest>=9.1",
    # floor kept from previous security bump
    "pygments>=2.20.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.15"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: needs the docker compose database; set TEST_DATABASE_URL to run",
]
