services:
  postgres:
    image: postgres:18
    shm_size: 1gb
    healthcheck:
      # Checked over TCP, which Postgres only opens once the init scripts have
      # run, and by querying the data, which db/01-init.sh loads in a single
      # transaction: a restart after a failed load stays unhealthy.
      test: [ "CMD-SHELL", "PGPASSWORD=$$APP_DB_PASS psql -h 127.0.0.1 -U $$APP_DB_USER -d $$APP_DB_NAME -tAc 'SELECT 1 FROM formulary LIMIT 1' | grep -q 1" ]
      start_period: 120s
      interval: 5s
      timeout: 10s
      retries: 5
    restart: always
    # Credentials come from .env, which git ignores: cp .env.example .env
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?copy .env.example to .env}
      - APP_DB_USER=${APP_DB_USER:?copy .env.example to .env}
      - APP_DB_PASS=${APP_DB_PASS:?copy .env.example to .env}
      - APP_DB_NAME=${APP_DB_NAME:?copy .env.example to .env}
    volumes:
      - ./db:/docker-entrypoint-initdb.d/:ro
      - ./data:/data:ro
    ports:
      # Only reachable from this machine, since the passwords are defaults.
      - "127.0.0.1:5432:5432"
