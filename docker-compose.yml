services:
  postgres:
    image: postgres:18
    shm_size: 1gb
    healthcheck:
      # Checked over TCP: while the init scripts load the data, Postgres only
      # listens on its socket, so this passes once the data is ready.
      test: [ "CMD", "pg_isready", "-q", "-h", "127.0.0.1", "-d", "formulary", "-U", "appuser" ]
      timeout: 45s
      interval: 5s
      retries: 30
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - APP_DB_USER=appuser
      - APP_DB_PASS=appuser
      - APP_DB_NAME=formulary
    volumes:
      - ./db:/docker-entrypoint-initdb.d/:ro
      - ./data:/data:ro
    ports:
      - "5432:5432"
